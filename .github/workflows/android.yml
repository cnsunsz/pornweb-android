name: Android CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode release keystore
        env:
          SIGNING_STORE_BASE64: ${{ secrets.SIGNING_STORE_BASE64 }}
        run: |
          if [ -n "${SIGNING_STORE_BASE64:-}" ]; then
            echo "$SIGNING_STORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "Using repo keystore/pornweb.jks for signing."
          fi

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Stage artifacts
        run: |
          mkdir -p dist
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="${GITHUB_SHA::7}"
          fi
          echo "APP_VER=$VER" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/PornWeb-${VER}-debug.apk"
          if [[ -f app/build/outputs/apk/release/app-release.apk ]]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/PornWeb-${VER}-release.apk"
          fi
          ls -lh dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PornWeb-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Build release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME}"
          python3 << 'PY'
          import os, pathlib, re
          tag = os.environ["GITHUB_REF_NAME"]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          # Extract section ## vX.Y.Z until next ## or EOF
          pat = re.compile(rf"(^## {re.escape(tag)}\s*\n)(.*?)(?=^## |\Z)", re.M | re.S)
          m = pat.search(text)
          if m:
              body = f"## {tag}\n" + m.group(2).strip() + "\n"
          else:
              body = f"## {tag}\n\n详见 CHANGELOG.md 与提交记录。\n"
          body += "\n---\n\n完整记录见仓库 [CHANGELOG.md](https://github.com/cnsunsz/pornweb-android/blob/main/CHANGELOG.md)。\n"
          pathlib.Path("dist/RELEASE_NOTES.md").write_text(body, encoding="utf-8")
          print(body)
          PY

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          body_path: dist/RELEASE_NOTES.md
          draft: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
